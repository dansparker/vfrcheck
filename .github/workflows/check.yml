name: vfrcheck
on:
  schedule:
    - cron: "*/10 * * * *"   # Telegram-Befehle alle 10 min, volle Prüfung stündlich
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Benachrichtigung erzwingen"
        type: boolean
        default: false
      briefing:
        description: "Briefing-Mail sofort senden"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: vfrcheck
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m vfrcheck ${{ inputs.force_notify && '--force-notify' || '' }} ${{ inputs.briefing && '--briefing' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          AUTOROUTER_USER: ${{ secrets.AUTOROUTER_USER }}
          AUTOROUTER_PASS: ${{ secrets.AUTOROUTER_PASS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: querschnitte
          path: charts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Zustand speichern
        run: |
          git config user.name "vfrcheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state flights
          git diff --cached --quiet || (git commit -m "state/flights update" && git pull --rebase -q && git push)
